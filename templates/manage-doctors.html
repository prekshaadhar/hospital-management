<!DOCTYPE html>
<html>
<head>
    <title>Manage Doctors - Aarogya Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Doctor Directory</h2>
    <table>
        <tr>
            <th>ID</th><th>Name</th><th>Specialization</th><th>Experience</th><th>Contact</th><th>Action</th>
        </tr>
        {% for doctor in doctors %}
        <tr>
            <td>{{ doctor.doctor_id }}</td>
            <td>{{ doctor.name }}</td>
            <td>{{ doctor.specialization }}</td>
            <td>{{ doctor.experience }}</td>
            <td>{{ doctor.contact }}</td>
            <td>
                <!-- Placeholder for future update/delete -->
                <button>Edit</button>
                <button>Delete</button>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
